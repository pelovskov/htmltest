<!DOCTYPE html>
<html lang="da" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Link Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        code, textarea, pre { font-family: 'Fira Code', monospace; }
    </style>
</head>
<body class="h-full text-slate-800 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md shadow-indigo-200">
                    <i class="fa-brands fa-markdown text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 leading-tight">Markdown Link Generator</h1>
                    <p class="text-xs text-slate-500">Konvertér en liste af URL'er til ren Markdown syntaks</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="loadExample()" class="px-3 py-1.5 text-xs font-medium text-slate-600 hover:text-indigo-600 bg-slate-100 hover:bg-indigo-50 rounded-lg transition-colors border border-slate-200 flex items-center gap-1.5">
                    <i class="fa-solid fa-wand-magic-sparkles text-indigo-500"></i> Indsæt Eksempel
                </button>
                <button onclick="clearAll()" class="px-3 py-1.5 text-xs font-medium text-slate-600 hover:text-red-600 bg-slate-100 hover:bg-red-50 rounded-lg transition-colors border border-slate-200 flex items-center gap-1.5">
                    <i class="fa-solid fa-trash-can text-slate-400"></i> Ryd alt
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col gap-6">
        
        <!-- Controls Bar -->
        <section class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap gap-4 sm:gap-6 items-center justify-between">
            
            <!-- Link Title Mode -->
            <div class="flex flex-col gap-1.5 min-w-[220px] flex-1">
                <label class="text-xs font-semibold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-font text-indigo-500"></i> Tekst i [hager]
                </label>
                <select id="titleMode" onchange="processLinks()" class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 p-2.5 outline-none transition-all">
                    <option value="empty">Tom [ ] (fyld selv ind)</option>
                    <option value="custom">Fast tekst (f.eks. [Læs mere])</option>
                    <option value="slug">Renset sti (f.eks. [danseskolen-under-jorden])</option>
                    <option value="pretty">Flot Titel (f.eks. [Danseskolen Under Jorden])</option>
                    <option value="fullurl">Fuld URL som tekst</option>
                </select>
            </div>

            <!-- Custom Title Input (Hidden by default unless selected) -->
            <div id="customTitleContainer" class="hidden flex-col gap-1.5 min-w-[180px] flex-1">
                <label class="text-xs font-semibold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-pen text-indigo-500"></i> Egen Tekst
                </label>
                <input type="text" id="customTitleText" value="Link" oninput="processLinks()" placeholder="Indtast tekst..." class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 p-2.5 outline-none transition-all">
            </div>

            <!-- List Prefix -->
            <div class="flex flex-col gap-1.5 min-w-[180px] flex-1">
                <label class="text-xs font-semibold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-list-ul text-indigo-500"></i> Opstilling
                </label>
                <select id="listPrefix" onchange="processLinks()" class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 p-2.5 outline-none transition-all">
                    <option value="none">Ingen (Kun linjeskift)</option>
                    <option value="bullet">Punktopstilling (- [Link](url))</option>
                    <option value="numbered">Nummereret (1. [Link](url))</option>
                </select>
            </div>

            <!-- Toggle Options -->
            <div class="flex flex-wrap items-center gap-5 pt-2 sm:pt-0">
                <label class="inline-flex items-center cursor-pointer select-none">
                    <input type="checkbox" id="autoImages" checked onchange="processLinks()" class="sr-only peer">
                    <div class="relative w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                    <span class="ms-2.5 text-xs font-medium text-slate-700 flex items-center gap-1">
                        <i class="fa-regular fa-image text-slate-500"></i> Auto-detektér billeder (![Alt](url))
                    </span>
                </label>
            </div>

        </section>

        <!-- Workspace Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-1">
            
            <!-- Input Column -->
            <div class="flex flex-col bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="bg-slate-50/80 border-b border-slate-200 px-4 py-3 flex items-center justify-between">
                    <span class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-link text-indigo-500"></i> Indtast URL'er (én pr. linje)
                    </span>
                    <span id="inputCount" class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-medium">0 linjer</span>
                </div>
                <div class="p-4 flex-1 flex flex-col">
                    <textarea 
                        id="rawInput" 
                        oninput="processLinks()" 
                        placeholder="Sæt dine links ind her, f.eks.:&#10;https://domæne.dk/side1.html&#10;https://domæne.dk/billede.jpg" 
                        class="w-full flex-1 min-h-[300px] lg:min-h-[450px] p-3 text-sm text-slate-800 bg-slate-50/50 rounded-xl border border-slate-200 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-y transition-all leading-relaxed"
                    ></textarea>
                </div>
            </div>

            <!-- Output Column -->
            <div class="flex flex-col bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="bg-slate-50/80 border-b border-slate-200 px-4 py-3 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <button id="tabMarkdownBtn" onclick="switchTab('markdown')" class="text-sm font-semibold text-indigo-600 bg-white shadow-xs px-3 py-1 rounded-lg border border-slate-200 flex items-center gap-1.5 transition-all">
                            <i class="fa-brands fa-markdown text-indigo-500"></i> Markdown Output
                        </button>
                        <button id="tabPreviewBtn" onclick="switchTab('preview')" class="text-sm font-semibold text-slate-500 hover:text-slate-800 px-3 py-1 rounded-lg flex items-center gap-1.5 transition-all">
                            <i class="fa-regular fa-eye text-slate-400"></i> Forhåndsvisning
                        </button>
                    </div>
                    <span id="outputCount" class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-100 px-2.5 py-0.5 rounded-full font-medium">0 genereret</span>
                </div>

                <!-- Tab 1: Raw Markdown Output -->
                <div id="tabMarkdown" class="p-4 flex-1 flex flex-col relative group">
                    <textarea 
                        id="markdownOutput" 
                        readonly 
                        placeholder="Dine genererede Markdown-links vil vises her..." 
                        class="w-full flex-1 min-h-[300px] lg:min-h-[450px] p-3 text-sm text-indigo-950 bg-slate-900/5 rounded-xl border border-slate-200 outline-none resize-y leading-relaxed font-mono"
                    ></textarea>
                    
                    <!-- Floating Action Buttons -->
                    <div class="absolute top-7 right-7 flex items-center gap-2">
                        <button 
                            onclick="copyToClipboard()" 
                            id="copyBtn"
                            class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white px-4 py-2 rounded-xl shadow-md text-xs font-semibold flex items-center gap-2 transition-all cursor-pointer"
                        >
                            <i class="fa-regular fa-copy"></i>
                            <span id="copyBtnText">Kopiér Markdown</span>
                        </button>
                    </div>
                </div>

                <!-- Tab 2: Visual Preview -->
                <div id="tabPreview" class="p-4 flex-1 hidden flex-col">
                    <div id="previewContent" class="w-full flex-1 min-h-[300px] lg:min-h-[450px] p-4 text-sm text-slate-800 bg-slate-50/50 rounded-xl border border-slate-200 overflow-y-auto space-y-2">
                        <p class="text-slate-400 italic">Forhåndsvisning vises her...</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Notification Toast -->
        <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 transition-all duration-300 transform translate-y-20 opacity-0 z-50">
            <div class="w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                <i class="fa-solid fa-check text-xs"></i>
            </div>
            <span id="toastMsg" class="text-sm font-medium">Markdown kopieret til udklipsholder!</span>
        </div>

    </main>

    <script>
        // Sample links matching the user's example
        const sampleLinks = [
            "https://pelovskov.github.io/pelapps/lydfortaellinger/lyd-fort-gen.html",
            "https://pelovskov.github.io/pelapps/lydfortaellinger/danseskolen-under-jorden.html",
            "https://pelovskov.github.io/pelapps/lydfortaellinger/lydfortaelling-katalog.html",
            "https://pelovskov.github.io/pelapps/lydfortaellinger/moerket-over-roskilde.html",
            "https://pelovskov.github.io/pelapps/lydfortaellinger/pel-1.jpg",
            "https://pelovskov.github.io/pelapps/lydfortaellinger/phillips-grammofon.html",
            "https://pelovskov.github.io/pelapps/lydfortaellinger/phillips-rejsegrammofon.html",
            "https://pelovskov.github.io/pelapps/lydfortaellinger/phr_contrast.jpg",
            "https://pelovskov.github.io/pelapps/lydfortaellinger/readme.md"
        ];

        // Load example into raw input
        function loadExample() {
            document.getElementById('rawInput').value = sampleLinks.join('\n');
            processLinks();
            showToast("Eksempel på links er indlæst!");
        }

        // Clear input and output
        function clearAll() {
            document.getElementById('rawInput').value = '';
            processLinks();
            showToast("Input er ryddet.");
        }

        // Process URLs into Markdown
        function processLinks() {
            const rawText = document.getElementById('rawInput').value;
            const titleMode = document.getElementById('titleMode').value;
            const customTitleText = document.getElementById('customTitleText').value;
            const listPrefix = document.getElementById('listPrefix').value;
            const autoImages = document.getElementById('autoImages').checked;

            // Toggle custom title text visibility
            const customTitleContainer = document.getElementById('customTitleContainer');
            if (titleMode === 'custom') {
                customTitleContainer.classList.remove('hidden');
                customTitleContainer.classList.add('flex');
            } else {
                customTitleContainer.classList.add('hidden');
                customTitleContainer.classList.remove('flex');
            }

            const lines = rawText.split('\n');
            let validLineCount = 0;
            const markdownLines = [];
            const previewElements = [];

            lines.forEach((line) => {
                const trimmed = line.trim();
                
                // If line is empty, retain empty space or skip
                if (!trimmed) {
                    markdownLines.push('');
                    return;
                }

                validLineCount++;

                // Check if it's an image extension
                const isImage = autoImages && /\.(jpg|jpeg|png|gif|webp|svg|bmp|tiff)$/i.test(trimmed);

                // Derive title text based on mode
                let displayTitle = '';

                switch (titleMode) {
                    case 'empty':
                        displayTitle = '';
                        break;
                    case 'custom':
                        displayTitle = customTitleText || 'Link';
                        break;
                    case 'slug':
                        displayTitle = extractSlug(trimmed);
                        break;
                    case 'pretty':
                        displayTitle = formatPrettyTitle(extractSlug(trimmed));
                        break;
                    case 'fullurl':
                        displayTitle = trimmed;
                        break;
                    default:
                        displayTitle = '';
                }

                // Format Markdown line
                let mdLink = '';
                if (isImage) {
                    // Image format: ![Alt](url)
                    const imgAlt = displayTitle || extractSlug(trimmed) || 'Billede';
                    mdLink = `![${imgAlt}](${trimmed})`;
                } else {
                    // Regular link format: [Text](url)
                    mdLink = `[${displayTitle}](${trimmed})`;
                }

                // Prefix prefix logic (bullets / numbered)
                let finalMd = mdLink;
                if (listPrefix === 'bullet') {
                    finalMd = `- ${mdLink}`;
                } else if (listPrefix === 'numbered') {
                    finalMd = `${validLineCount}. ${mdLink}`;
                }

                markdownLines.push(finalMd);

                // Build HTML element for Preview tab
                previewElements.push(buildPreviewHTML(trimmed, displayTitle, isImage, listPrefix, validLineCount));
            });

            // Update UI
            document.getElementById('inputCount').innerText = `${lines.filter(l => l.trim()).length} links`;
            document.getElementById('outputCount').innerText = `${validLineCount} genereret`;
            
            const finalOutputText = markdownLines.join('\n');
            document.getElementById('markdownOutput').value = finalOutputText;

            // Render Preview
            const previewContainer = document.getElementById('previewContent');
            if (previewElements.length === 0) {
                previewContainer.innerHTML = '<p class="text-slate-400 italic">Forhåndsvisning vises her...</p>';
            } else {
                previewContainer.innerHTML = previewElements.join('');
            }
        }

        // Extract filename slug from URL
        function extractSlug(urlStr) {
            try {
                // Remove query parameters or hash
                const cleanUrl = urlStr.split('?')[0].split('#')[0];
                const parts = cleanUrl.split('/');
                let filename = parts[parts.length - 1] || parts[parts.length - 2] || urlStr;
                
                // Strip extension if present
                if (filename.includes('.')) {
                    filename = filename.substring(0, filename.lastIndexOf('.'));
                }
                return filename;
            } catch (e) {
                return urlStr;
            }
        }

        // Convert slug like "danseskolen-under-jorden" or "phr_contrast" into "Danseskolen Under Jorden"
        function formatPrettyTitle(slug) {
            if (!slug) return '';
            return slug
                .replace(/[-_]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim()
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
                .join(' ');
        }

        // Generate preview DOM elements
        function buildPreviewHTML(url, title, isImage, listPrefix, count) {
            const displayLabel = title ? title : `<span class="text-slate-400 italic font-mono">[tom tekst]</span>`;
            
            let itemContent = '';
            if (isImage) {
                itemContent = `
                    <div class="inline-flex items-center gap-2 bg-indigo-50 border border-indigo-100 rounded-lg p-2 text-indigo-900">
                        <i class="fa-regular fa-image text-indigo-500"></i>
                        <span class="font-medium text-xs">Billede: ${displayLabel}</span>
                        <a href="${url}" target="_blank" rel="noopener" class="text-xs text-indigo-600 hover:underline flex items-center gap-1">
                            (${url.substring(0, 35)}...) <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                    </div>`;
            } else {
                itemContent = `
                    <a href="${url}" target="_blank" rel="noopener" class="text-indigo-600 font-medium hover:underline flex items-center gap-1.5">
                        <i class="fa-solid fa-link text-xs text-indigo-400"></i>
                        <span>${displayLabel}</span>
                    </a>`;
            }

            if (listPrefix === 'bullet') {
                return `<div class="flex items-start gap-2 my-1 ml-2"><span class="text-slate-400">•</span><div>${itemContent}</div></div>`;
            } else if (listPrefix === 'numbered') {
                return `<div class="flex items-start gap-2 my-1 ml-2"><span class="text-slate-400 font-mono text-xs mt-0.5">${count}.</span><div>${itemContent}</div></div>`;
            } else {
                return `<div class="my-1.5">${itemContent}</div>`;
            }
        }

        // Switch Tab view (Markdown / Preview)
        function switchTab(tab) {
            const mdTab = document.getElementById('tabMarkdown');
            const previewTab = document.getElementById('tabPreview');
            const mdBtn = document.getElementById('tabMarkdownBtn');
            const previewBtn = document.getElementById('tabPreviewBtn');

            if (tab === 'markdown') {
                mdTab.classList.remove('hidden');
                mdTab.classList.add('flex');
                previewTab.classList.add('hidden');
                previewTab.classList.remove('flex');

                mdBtn.className = "text-sm font-semibold text-indigo-600 bg-white shadow-xs px-3 py-1 rounded-lg border border-slate-200 flex items-center gap-1.5 transition-all";
                previewBtn.className = "text-sm font-semibold text-slate-500 hover:text-slate-800 px-3 py-1 rounded-lg flex items-center gap-1.5 transition-all";
            } else {
                previewTab.classList.remove('hidden');
                previewTab.classList.add('flex');
                mdTab.classList.add('hidden');
                mdTab.classList.remove('flex');

                previewBtn.className = "text-sm font-semibold text-indigo-600 bg-white shadow-xs px-3 py-1 rounded-lg border border-slate-200 flex items-center gap-1.5 transition-all";
                mdBtn.className = "text-sm font-semibold text-slate-500 hover:text-slate-800 px-3 py-1 rounded-lg flex items-center gap-1.5 transition-all";
            }
        }

        // Copy to clipboard fallback mechanism
        function copyToClipboard() {
            const textarea = document.getElementById('markdownOutput');
            if (!textarea.value.trim()) {
                showToast("Der er intet at kopiere endnu!");
                return;
            }

            // Standard fallback using select & execCommand for cross-browser / iframe support
            textarea.select();
            textarea.setSelectionRange(0, 99999); // For mobile devices

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    triggerCopyFeedback();
                } else {
                    showToast("Kunne ikke kopiere automatisk. Marker teksten manuelt.");
                }
            } catch (err) {
                showToast("Kopiering fejlede.");
            }
        }

        function triggerCopyFeedback() {
            const btnText = document.getElementById('copyBtnText');
            const copyBtn = document.getElementById('copyBtn');
            
            btnText.innerText = "Kopieret!";
            copyBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
            copyBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');

            showToast("Markdown kopieret til udklipsholder!");

            setTimeout(() => {
                btnText.innerText = "Kopiér Markdown";
                copyBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
                copyBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
            }, 2000);
        }

        // Display Toast Notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = message;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // On window load, initialize with demo input if empty
        window.onload = function() {
            loadExample();
        };
    </script>
</body>
</html>
