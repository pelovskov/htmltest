<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>GitHub Pages URL-generator</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #1f2320;
    --muted: #6b7268;
    --line: #dcd8d0;
    --accent: #2f5d4f;
    --accent-soft: #e7efe9;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    padding: 32px 16px;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 4px 0;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 0.9rem;
    background: #fbfaf8;
  }
  textarea {
    width: 100%;
    min-height: 160px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 0.88rem;
    line-height: 1.5;
    resize: vertical;
    background: #fbfaf8;
  }
  input:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .row { margin-bottom: 16px; }
  .row:last-child { margin-bottom: 0; }
  .btn-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 14px;
  }
  button {
    border: none;
    background: var(--accent);
    color: white;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .status {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .out-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .count {
    font-size: 0.78rem;
    color: var(--muted);
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>GitHub Pages URL-generator</h1>
  <div class="sub">Indsæt et præfix og en liste af filnavne — få en liste af færdige links.</div>

  <div class="card">
    <div class="row">
      <label for="prefix">Præfix (repo/mappe-url)</label>
      <input type="text" id="prefix" placeholder="https://pelovskov.github.io/htmltest" value="https://pelovskov.github.io/htmltest">
    </div>
    <div class="row">
      <label for="files">Filnavne (én pr. linje)</label>
      <textarea id="files" placeholder="builder-x.html
lang-rapport-generator.html
README.md"></textarea>
    </div>
    <div class="btn-row">
      <button onclick="generate()">Generér links</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <div class="card">
    <div class="out-label">
      <label for="output">Resultat</label>
      <span class="count" id="count"></span>
    </div>
    <textarea id="output" readonly placeholder="Links vises her..."></textarea>
    <div class="btn-row">
      <button class="secondary" onclick="copyOutput()">Kopiér alle</button>
      <span class="status" id="copyStatus"></span>
    </div>
  </div>
</div>

<script>
function generate() {
  let prefix = document.getElementById('prefix').value.trim();
  // fjern trailing slash så vi ikke får dobbelt //
  prefix = prefix.replace(/\/+$/, '');

  const rawLines = document.getElementById('files').value.split('\n');
  const links = [];

  for (let line of rawLines) {
    let name = line.trim();
    if (!name) continue;
    // fjern evt. ledende slash på filnavnet
    name = name.replace(/^\/+/, '');
    links.push(prefix + '/' + name);
  }

  document.getElementById('output').value = links.join('\n');
  document.getElementById('count').textContent = links.length ? (links.length + ' links') : '';
  document.getElementById('status').textContent = links.length ? 'Klar' : 'Ingen filnavne fundet';
  setTimeout(() => { document.getElementById('status').textContent = ''; }, 1500);
}

function copyOutput() {
  const out = document.getElementById('output');
  if (!out.value) return;
  out.select();
  navigator.clipboard.writeText(out.value).then(() => {
    document.getElementById('copyStatus').textContent = 'Kopieret!';
    setTimeout(() => { document.getElementById('copyStatus').textContent = ''; }, 1500);
  });
}
</script>
</body>
</html>
