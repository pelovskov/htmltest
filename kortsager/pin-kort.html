<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Latitude & Longitude</title>

    <!-- Leaflet CSS for kortet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Sørger for at kortet har en fast højde */
        #map {
            height: 400px;
            border-radius: 0.5rem;
            border: 1px solid #ddd;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f7fafc;
            font-family: 'Inter', sans-serif;
        }
        /* Tilføj en lille skygge til knapperne for bedre udseende */
        .btn {
            transition: all 0.2s ease-in-out;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="p-4 sm:p-6 md:p-8">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg">

        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Koordinat Finder</h1>
            <p class="text-gray-600 mt-1">Klik på kortet for at placere en markør og få dens koordinater.</p>
        </header>

        <!-- Selve kortet bliver indlæst her -->
        <div id="map" class="w-full mb-6 z-0"></div>

        <!-- Sektion 1: Visning og kopiering af koordinater fra kortet -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end mb-8 p-4 bg-gray-50 rounded-lg">
            <div class="md:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="sourceLat" class="block text-sm font-medium text-gray-700">Latitude (fra kort)</label>
                    <input type="text" id="sourceLat" readonly placeholder="Vælg et punkt på kortet" class="mt-1 block w-full px-3 py-2 bg-gray-200 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm cursor-not-allowed">
                </div>
                <div>
                    <label for="sourceLng" class="block text-sm font-medium text-gray-700">Longitude (fra kort)</label>
                    <input type="text" id="sourceLng" readonly placeholder="Vælg et punkt på kortet" class="mt-1 block w-full px-3 py-2 bg-gray-200 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm cursor-not-allowed">
                </div>
            </div>
            <div>
                <button id="copyBtn" class="w-full btn bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-gray-400 disabled:cursor-not-allowed" disabled>
                    Kopier Koordinater
                </button>
            </div>
        </div>

        <hr class="my-8 border-gray-200">

        <!-- Sektion 2: Formular hvor koordinater kan indsættes -->
        <div>
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Formular</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end p-4 bg-gray-50 rounded-lg">
                <div class="md:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4">
                     <div>
                        <label for="formLat" class="block text-sm font-medium text-gray-700">Latitude</label>
                        <input type="text" id="formLat" placeholder="Indsæt latitude her" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>
                    <div>
                        <label for="formLng" class="block text-sm font-medium text-gray-700">Longitude</label>
                        <input type="text" id="formLng" placeholder="Indsæt longitude her" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>
                </div>
                <div>
                    <button id="pasteBtn" class="w-full btn bg-green-600 text-white font-bold py-2 px-4 rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                        Indsæt fra Clipboard
                    </button>
                </div>
            </div>
        </div>

        <!-- Lille besked-boks til feedback -->
        <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white py-2 px-4 rounded-lg shadow-lg opacity-0 transition-opacity duration-300">
            Besked
        </div>

    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

    <script>
        // Opsætning af DOM elementer
        const sourceLatInput = document.getElementById('sourceLat');
        const sourceLngInput = document.getElementById('sourceLng');
        const formLatInput = document.getElementById('formLat');
        const formLngInput = document.getElementById('formLng');
        const copyBtn = document.getElementById('copyBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const toast = document.getElementById('toast');

        // Initialisering af kortet, centreret over Roskilde
        // Koordinater for Roskilde: [Latitude, Longitude], Zoom level
        const map = L.map('map').setView([55.6415, 12.0801], 13);

        // Tilføj et "tile layer" til kortet - det er selve kortbilledet
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        let marker = null;

        // Funktion der viser en besked (toast)
        function showToast(message) {
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000); // Beskeden forsvinder efter 2 sekunder
        }

        // Lyt efter klik på kortet
        map.on('click', function(e) {
            const lat = e.latlng.lat.toFixed(6); // 6 decimaler for præcision
            const lng = e.latlng.lng.toFixed(6);

            sourceLatInput.value = lat;
            sourceLngInput.value = lng;

            // Hvis der ikke er en markør, opret en. Ellers, flyt den eksisterende.
            if (marker === null) {
                marker = L.marker(e.latlng).addTo(map);
            } else {
                marker.setLatLng(e.latlng);
            }

            // Gør "Kopier"-knappen aktiv
            copyBtn.disabled = false;
        });

        // Lyt efter klik på "Kopier"-knappen
        copyBtn.addEventListener('click', () => {
            const textToCopy = `${sourceLatInput.value}, ${sourceLngInput.value}`;

            // Bruger en midlertidig textarea for at sikre kompatibilitet med 'copy' kommandoen
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = textToCopy;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();

            try {
                document.execCommand('copy');
                showToast('Kopieret til clipboard!');
            } catch (err) {
                showToast('Fejl: Kunne ikke kopiere.');
                console.error('Kunne ikke kopiere tekst: ', err);
            }

            document.body.removeChild(tempTextArea);
        });

        // Lyt efter klik på "Indsæt"-knappen
        pasteBtn.addEventListener('click', async () => {
            try {
                // Bruger den moderne Clipboard API til at læse tekst
                // Brugeren kan blive bedt om tilladelse første gang
                const text = await navigator.clipboard.readText();

                // Splitter teksten ved komma
                const parts = text.split(',');

                if (parts.length === 2) {
                    const lat = parts[0].trim(); // fjerner evt. mellemrum
                    const lng = parts[1].trim();

                    // Validerer at det ligner tal (evt. med minus foran)
                    if (!isNaN(lat) && !isNaN(lng)) {
                        formLatInput.value = lat;
                        formLngInput.value = lng;
                        showToast('Koordinater er indsat!');
                    } else {
                       showToast('Clipboard indeholder ikke gyldige koordinater.');
                    }
                } else {
                    showToast('Formatet i clipboard er ukendt. Forventer "lat, lon".');
                }
            } catch (err) {
                showToast('Kunne ikke læse fra clipboard.');
                console.error('Fejl ved læsning fra clipboard: ', err);
            }
        });

    </script>
</body>
</html>
